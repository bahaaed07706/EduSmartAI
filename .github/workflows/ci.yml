name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # Two operating systems rather than two Python versions: numpy 1.26.3 ships
    # no wheel for 3.13 and fails to build from source, and that pin is not
    # arbitrary — scikit-learn 1.7.2 and numpy 1.26.3 are the versions the
    # Saved_Models/*.joblib artifacts were pickled with. Loosening them to win a
    # version matrix would risk silently changing predictions, which is exactly
    # the class of bug docs/ml-evaluation.md records fixing. Windows earns its
    # place here instead: this project is developed on Windows and has already
    # shipped one path-handling bug that only Linux would have caught.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only secret so config's startup guard passes; never a real secret.
      JWT_SECRET: ci-only-secret-not-for-production-use
      SKIP_MODEL_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff — real-bug rules)
        run: ruff check .

      - name: Type check (mypy — report only, does not gate)
        # Non-blocking on purpose. The baseline is ~180 errors, nearly all of
        # them SQLAlchemy `Column[...]` assignment false positives from the
        # legacy declarative style. Clearing them means re-annotating the ORM
        # layer with Mapped[...], which is a real piece of work and not a
        # prerequisite for shipping. Reported so regressions are visible; a gate
        # nobody can pass gets deleted rather than fixed.
        continue-on-error: true
        run: mypy . --ignore-missing-imports --explicit-package-bases --exclude "venv|tests"

      # Coverage runs on Linux only. The gate is the same either way, and
      # measuring it twice would roughly double the slowest job for no signal.
      - name: Tests with coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: pytest -q --cov --cov-report=term

      - name: Tests
        if: matrix.os != 'ubuntu-latest'
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edusmartai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the Node/npm that generated package-lock.json. On Node 18
          # the older npm resolves a different dependency tree and `npm ci`
          # fails with "Missing: yaml@... from lock file".
          node-version: "24"
      - name: Install dependencies
        env:
          # puppeteer is a devDependency used only by scripts/a11y-audit.js,
          # which CI does not run. Skip the ~150MB Chromium download.
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Production build
        env:
          CI: "true"
        run: npm run build
      - name: Dependency audit (non-blocking, report only)
        run: npm audit --omit=dev || true
