# Render Blueprint — EduSmartAI backend (free tier)
#
# Scope: the API only. The React frontend deploys to Vercel (see
# edusmartai-frontend/vercel.json) — it is a static bundle with no server-side
# needs, so a CDN is the better fit and the two halves redeploy independently.
#
# Why the backend is not serverless: it writes to a database and an uploads
# directory on every request and holds a 14.3 MB model resident in memory. That
# needs a long-lived process. See docs/deployment-decision.md.
#
# ---------------------------------------------------------------------------
# Free-tier trade-offs, stated plainly rather than discovered later:
#
#   * No persistent disk. Free web services cannot mount one, so the database
#     and uploads live on the container filesystem and are wiped on every
#     restart and redeploy.
#   * Because of that, the database is SQLite rather than Postgres. Render's
#     free Postgres is deleted after 30 days, which would silently kill the
#     demo; an ephemeral SQLite file has no expiry and is the configuration the
#     whole test suite runs against.
#   * DEMO_RESET_ON_BOOT turns the wipe into the intended behaviour: every boot
#     rebuilds the same clean synthetic dataset, so a visitor never inherits
#     whatever the previous one typed.
#   * Files uploaded during a demo session do not survive a restart.
#   * The service sleeps after ~15 minutes idle. The next request pays a cold
#     start of roughly a minute while the model deserialises.
#
# For a durable deployment: point DATABASE_URL at a managed Postgres (Neon's
# free tier has no expiry), move to a paid plan for a mounted disk at
# UPLOAD_DIR, and set DEMO_RESET_ON_BOOT to false so real data is never wiped.
# ---------------------------------------------------------------------------
#
# Secrets are NOT in this file. Values marked `sync: false` are set in the
# Render dashboard; JWT_SECRET is generated by Render and never seen by anyone.

services:
  - type: web
    name: edusmartai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrate, then rebuild demo data, then serve. seed_boot.py is a no-op
    # unless DEMO_RESET_ON_BOOT is explicitly enabled, so this same command is
    # safe against a database whose contents matter.
    startCommand: >-
      python migrate_schema.py &&
      python seed_boot.py &&
      uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      # Enables the security posture: no API docs, HSTS, exact-origin CORS.
      - key: ENVIRONMENT
        value: production
      # Deliberately a separate switch from ENVIRONMENT. Seeding must not be
      # something a deployment turns on by relaxing its security setting, and
      # hardening must not be something it gives up to get a seeded demo.
      # See backend/config.py and backend/tests/test_demo_seed_gating.py.
      - key: DEMO_RESET_ON_BOOT
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"
      # Ephemeral by design — see the free-tier notes above.
      - key: DATABASE_URL
        value: sqlite:////tmp/edusmart.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MODELS_DIR
        value: ../Saved_Models
      - key: JWT_SECRET
        generateValue: true      # Render generates it; nobody ever reads it
      # Set in the dashboard once the frontend URL exists. Must be the exact
      # origin — main.py refuses to boot on a wildcard in production.
      - key: CORS_ORIGINS
        sync: false
      # Optional. Without it the chatbot uses its local fallback, and the API
      # honestly reports ai_powered=false.
      - key: GROQ_API_KEY
        sync: false
      # Synthetic demo accounts. seed_data.py refuses to run without these and
      # requires 12+ characters. Never reuse a password from anywhere else.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_LECTURER_PASSWORD
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false

# The frontend is NOT defined here. It deploys to Vercel from
# edusmartai-frontend/vercel.json. Set REACT_APP_API_BASE_URL there to this
# service's URL, and set CORS_ORIGINS above to the Vercel domain.
