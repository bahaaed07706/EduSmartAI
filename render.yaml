# Render Blueprint — EduSmartAI
#
# Why this shape: the backend writes to a database and an uploads directory on
# every request, and holds a 14.3 MB model resident in memory. That needs a
# long-lived service with a persistent disk, not a serverless function.
# See docs/deployment-decision.md for the full comparison.
#
# Secrets are NOT in this file. Values marked `sync: false` must be set in the
# Render dashboard; JWT_SECRET is generated by Render and never seen by anyone.

databases:
  - name: edusmartai-db
    databaseName: edusmartai
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: edusmartai-api
    runtime: python
    plan: starter          # free tier has no persistent disk
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_schema.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: edusmartai-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true      # Render generates it; nobody ever reads it
      - key: MODELS_DIR
        value: ../Saved_Models
      # Set in the dashboard after the frontend URL exists. Must be the exact
      # origin — main.py refuses to boot on a wildcard in production.
      - key: CORS_ORIGINS
        sync: false
      # Optional. Without it the chatbot uses its local fallback, and the API
      # honestly reports ai_powered=false.
      - key: GROQ_API_KEY
        sync: false
      # Synthetic demo accounts. seed_data.py refuses to run without these and
      # requires 12+ characters. Never reuse a password from anywhere else.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_LECTURER_PASSWORD
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false

  # --------------------------------------------------------------- frontend
  - type: web
    name: edusmartai-web
    runtime: static
    rootDir: edusmartai-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      # Points at the API service above.
      - key: REACT_APP_API_URL
        sync: false
      # Demo credentials shown on the login screen. Leave unset to show
      # nothing. The admin account is deliberately never listed.
      - key: REACT_APP_DEMO_STUDENT_EMAIL
        sync: false
      - key: REACT_APP_DEMO_STUDENT_PASSWORD
        sync: false
      - key: REACT_APP_DEMO_LECTURER_EMAIL
        sync: false
      - key: REACT_APP_DEMO_LECTURER_PASSWORD
        sync: false
    routes:
      # Client-side routing: every unmatched path serves the SPA shell.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
